<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RetinaProgress Preference Review</title><style>
:root{color-scheme:dark;--bg:#06100e;--panel:#10201c;--ink:#eef8f3;--muted:#9bb2a8;--accent:#57d89a}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,sans-serif}header,.form{padding:18px 22px;background:var(--panel)}h1{margin:0 0 6px;font-size:22px}p{margin:4px 0;color:var(--muted)}main{padding:18px;display:grid;gap:22px}.candidate{background:var(--panel);padding:14px;border-radius:12px}.candidate h2{margin:0 0 10px;font-size:17px}.images{display:grid;grid-template-columns:repeat(6,minmax(120px,1fr));gap:8px}.tile img{width:100%;display:block}.tile b{display:block;text-align:center;margin-top:4px}.form{display:grid;gap:12px;position:sticky;bottom:0;border-top:1px solid #315348}.row{display:flex;gap:14px;flex-wrap:wrap}select,input,button{font:inherit}select,input{background:#081411;color:var(--ink);border:1px solid #42685c;padding:6px}button{background:var(--accent);color:#062016;border:0;border-radius:7px;padding:9px 15px;font-weight:800;cursor:pointer}#status{font-weight:800;color:var(--accent)}@media(max-width:900px){.images{grid-template-columns:repeat(2,1fr)}}
</style></head><body><header><h1>Same-eye progression preference review</h1><p id="meta">Loading…</p><p>Rank structural credibility, not darkness or framing. The outer disc and vessels should remain the same eye while the cup/rim changes smoothly.</p></header><main id="candidates"></main><section class="form"><div class="row" id="rankings"></div><div class="row"><label>Reviewer <input id="reviewer" value="student-reviewer"></label><label>Visible enlargement <input class="rating" id="visible_enlargement" type="number" min="1" max="5" value="3"></label><label>Temporal smoothness <input class="rating" id="temporal_smoothness" type="number" min="1" max="5" value="3"></label><label>Identity preservation <input class="rating" id="identity_preservation" type="number" min="1" max="5" value="3"></label><label>Sharpness <input class="rating" id="sharpness" type="number" min="1" max="5" value="3"></label><label>Artifact absence <input class="rating" id="artifact_absence" type="number" min="1" max="5" value="3"></label></div><div><button id="save">Save ranking</button> <span id="status"></span></div></section><script>
let review;const labels=['Original','Year 1','Year 2','Year 3','Year 4','Year 5'];fetch('/review.json').then(r=>r.json()).then(data=>{review=data;meta.textContent=`${data.eye_id} · research simulation only`;for(const candidate of data.candidates){const section=document.createElement('section');section.className='candidate';section.innerHTML=`<h2>${candidate.candidate_id}</h2><div class="images"></div>`;const images=[data.baseline,...candidate.images];images.forEach((src,index)=>{const tile=document.createElement('div');tile.className='tile';tile.innerHTML=`<img src="${src}" alt="${labels[index]}"><b>${labels[index]||`Year ${data.years[index-1]}`}</b>`;section.querySelector('.images').append(tile)});candidates.append(section);const label=document.createElement('label');label.textContent=`${candidate.candidate_id} rank `;label.innerHTML+=`<select data-candidate="${candidate.candidate_id}">${data.candidates.map((_,i)=>`<option>${i+1}</option>`).join('')}</select>`;rankings.append(label)}});
save.onclick=async()=>{const ordered=[...document.querySelectorAll('[data-candidate]')].map(s=>({id:s.dataset.candidate,rank:Number(s.value)})).sort((a,b)=>a.rank-b.rank);if(new Set(ordered.map(x=>x.rank)).size!==ordered.length){status.textContent='Use each rank once';return}const ratings={};document.querySelectorAll('.rating').forEach(x=>ratings[x.id]=Number(x.value));const response=await fetch('/api/preference',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({eye_id:review.eye_id,reviewer_code:reviewer.value.trim(),ranking:ordered.map(x=>x.id),ratings})});const result=await response.json();status.textContent=response.ok?'Saved':result.error||'Save failed'};
</script></body></html>
