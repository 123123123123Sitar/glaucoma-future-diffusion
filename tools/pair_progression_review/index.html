<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RetinaProgress Pair Review</title><style>
:root{color-scheme:dark;--bg:#07110f;--panel:#10201c;--ink:#eff8f4;--muted:#a0b5ac;--yes:#47d786;--no:#ff8a75}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,sans-serif}header,.actions{padding:16px 22px;background:var(--panel)}h1{margin:0;font-size:22px}p{margin:5px 0;color:var(--muted)}main{display:grid;grid-template-columns:1fr 1fr;gap:16px;padding:18px}.card{background:var(--panel);padding:12px;border-radius:10px}.card h2{font-size:16px;margin:0 0 8px}.card img{display:block;width:100%;background:#000}.actions{display:grid;gap:12px;position:sticky;bottom:0;border-top:1px solid #315348}.buttons{display:flex;gap:10px;flex-wrap:wrap}button,input,textarea{font:inherit}button{padding:10px 17px;border-radius:8px;border:1px solid #496d61;background:#17352d;color:var(--ink);cursor:pointer}button.yes{background:var(--yes);color:#062217;font-weight:800}button.no{background:var(--no);color:#2b0804;font-weight:800}textarea{width:100%;min-height:50px;background:#081411;color:var(--ink);border:1px solid #42685c;padding:8px}#status{font-weight:800;color:var(--yes)}@media(max-width:850px){main{grid-template-columns:1fr}}
</style></head><body><header><h1>Does this eye show meaningful structural progression?</h1><p id="meta">Loading…</p><p>Ignore brightness, blur, framing, and scale. Choose “different” only if the cup/rim anatomy itself looks meaningfully different.</p></header><main><section class="card"><h2>Original baseline</h2><img id="baseline" alt="Original baseline"></section><section class="card"><h2>Observed follow-up</h2><img id="future" alt="Observed follow-up"></section></main><section class="actions"><div class="buttons"><button class="yes" data-label="different">Yes, structurally different</button><button class="no" data-label="same">No, essentially the same</button><button data-label="uncertain">Too difficult / uncertain</button><button id="previous">Previous</button><span id="progress"></span></div><label>Reviewer <input id="reviewer" value="student-reviewer"></label><label><input id="quality" type="checkbox" checked> Image quality acceptable</label><textarea id="notes" placeholder="Optional note"></textarea><span id="status"></span></section><script>
let batch,index=0;function item(){return batch.records[index]}function load(){const x=item();meta.textContent=`${x.eye_id} · ${x.laterality} · ${x.horizon_years.toFixed(2)} years${x.repeat_group?' · masked repeat':''}`;baseline.src=x.baseline_asset;future.src=x.future_asset;progress.textContent=`${index+1} / ${batch.records.length}`;status.textContent='';notes.value=''}async function save(label){status.textContent='Saving…';const response=await fetch('/api/review',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({annotation_id:item().annotation_id,progression_label:label,quality_acceptable:quality.checked,reviewer_code:reviewer.value.trim(),notes:notes.value})});const result=await response.json();if(!response.ok){status.textContent=result.error||'Save failed';return}status.textContent='Saved';if(index+1<batch.records.length){index++;load()}else status.textContent='All cases reviewed'}document.querySelectorAll('[data-label]').forEach(b=>b.onclick=()=>save(b.dataset.label));previous.onclick=()=>{if(index>0){index--;load()}};fetch('/batch.json').then(r=>r.json()).then(data=>{batch=data;load()});
</script></body></html>
