<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Generated Progression Review</title><style>
:root{color-scheme:dark;--bg:#07110f;--panel:#10201c;--ink:#eff8f4;--muted:#a1b6ad;--yes:#48d989;--no:#ff8b76}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,sans-serif}header,.actions{padding:17px 22px;background:var(--panel)}h1{margin:0;font-size:22px}p{color:var(--muted);margin:5px 0}.sequence{display:grid;grid-template-columns:repeat(6,minmax(180px,1fr));gap:8px;padding:18px;overflow-x:auto}.tile{background:var(--panel);padding:8px;border-radius:8px}.tile img{width:100%;display:block}.tile b{display:block;text-align:center;margin-top:6px}.actions{display:flex;gap:10px;align-items:center;position:sticky;bottom:0;border-top:1px solid #315348}button{font:inherit;padding:10px 16px;border-radius:8px;border:1px solid #496d61;background:#17352d;color:var(--ink);cursor:pointer}.yes{background:var(--yes);color:#052217;font-weight:800}.no{background:var(--no);color:#2c0804;font-weight:800}#status{font-weight:800;color:var(--yes)}@media(max-width:950px){.sequence{grid-template-columns:repeat(2,1fr)}}
</style></head><body><header><h1>One eye: original → 4.8-year research simulation</h1><p>Judge the optic cup/rim itself. Ignore brightness alone. This is not a clinical prognosis.</p></header><main class="sequence" id="sequence"></main><section class="actions"><button class="yes" data-value="different">Looks structurally different</button><button class="no" data-value="same">Still looks the same</button><button data-value="uncertain">Uncertain</button><span id="status"></span></section><script>
let review;fetch('/review.json').then(r=>r.json()).then(data=>{review=data;const items=[['Original',data.baseline],...data.images.map((src,i)=>[`Year ${data.years[i]}`,src])];for(const [label,src] of items){const tile=document.createElement('div');tile.className='tile';tile.innerHTML=`<img src="${src}" alt="${label}"><b>${label}</b>`;sequence.append(tile)}});document.querySelectorAll('[data-value]').forEach(button=>button.onclick=async()=>{const response=await fetch('/api/review',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({judgment:button.dataset.value,reviewer_code:'student-reviewer',checkpoint:review.checkpoint,checkpoint_step:review.checkpoint_step})});status.textContent=response.ok?'Saved—thank you':'Save failed'});
</script></body></html>
