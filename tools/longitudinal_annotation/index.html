<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>RetinaProgress Longitudinal Annotation</title>
<style>
:root{color-scheme:dark;--bg:#07110f;--panel:#10201c;--ink:#edf7f2;--muted:#9eb5ab;--disc:#47d7ff;--cup:#ffd166;--ok:#49d17d}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,sans-serif}header,.controls,.assessment{padding:16px 22px;background:var(--panel);border-bottom:1px solid #274139}h1{margin:0;font-size:21px}p{margin:5px 0;color:var(--muted)}.controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap;position:sticky;top:0;z-index:3}button,select,input,textarea{font:inherit}button{border:1px solid #42685c;background:#17352d;color:var(--ink);padding:8px 12px;border-radius:7px;cursor:pointer}.active{outline:2px solid var(--ok)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;padding:18px}.card{background:var(--panel);padding:12px;border-radius:10px}.card h2{font-size:16px;margin:0 0 8px}canvas{display:block;width:100%;height:auto;background:#000;cursor:crosshair}.legend{display:flex;gap:18px;margin-top:8px}.disc{color:var(--disc)}.cup{color:var(--cup)}.assessment{display:grid;gap:12px}.row{display:flex;gap:15px;flex-wrap:wrap}.findings label{min-width:210px}textarea{width:100%;min-height:65px;background:#081411;color:var(--ink);border:1px solid #42685c;padding:8px}#status{font-weight:700;color:var(--ok)}@media(max-width:850px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><h1>Longitudinal optic-disc annotation</h1><p id="caseMeta">Loading…</p><p>Trace the outer disc and pale central cup. Structural progression means rim thinning, notching, excavation, or cup enlargement—not darkness, blur, or scale.</p></header>
<div class="controls"><button id="discMode" class="active">Trace disc</button><button id="cupMode">Trace cup</button><button id="undo">Undo point</button><button id="clear">Clear current contour</button><button id="previous">Previous</button><button id="next">Skip / next</button><span id="progress"></span></div>
<main class="grid"><section class="card"><h2>Original baseline</h2><canvas id="baseline" width="512" height="512"></canvas><div class="legend"><b class="disc">Disc outline</b><b class="cup">Cup outline</b></div></section><section class="card"><h2>Observed follow-up</h2><canvas id="future" width="512" height="512"></canvas><div class="legend"><b class="disc">Disc outline</b><b class="cup">Cup outline</b></div></section></main>
<section class="assessment"><div class="row"><label>Annotator code <input id="annotator" value="student-reviewer"></label><label>Progression <select id="label"><option value="progressor">Visible structural progression</option><option value="stable">Structurally stable</option><option value="uncertain">Uncertain</option></select></label><label><input id="quality" type="checkbox" checked> Image quality acceptable</label></div><div class="row findings"><label><input type="checkbox" value="rim_thinning"> Rim thinning</label><label><input type="checkbox" value="notching"> Notching</label><label><input type="checkbox" value="excavation"> Excavation/cup enlargement</label><label><input type="checkbox" value="vessel_displacement"> Vessel displacement</label><label><input type="checkbox" value="rnfl_defect"> RNFL defect</label><label><input type="checkbox" value="acquisition_artifact"> Acquisition artifact</label></div><textarea id="notes" placeholder="Optional notes"></textarea><div><button id="save">Save annotation and continue</button> <span id="status"></span></div></section>
<script>
const state={batch:null,index:0,mode:'disc',points:{baseline:{disc:[],cup:[]},future:{disc:[],cup:[]}},images:{}};
const colors={disc:'#47d7ff',cup:'#ffd166'};
function draw(which){const canvas=document.getElementById(which),ctx=canvas.getContext('2d'),image=state.images[which];ctx.clearRect(0,0,512,512);if(image)ctx.drawImage(image,0,0,512,512);for(const kind of ['disc','cup']){const pts=state.points[which][kind];if(!pts.length)continue;ctx.strokeStyle=colors[kind];ctx.lineWidth=3;ctx.beginPath();pts.forEach((p,i)=>(i?ctx.lineTo(p.x*512,p.y*512):ctx.moveTo(p.x*512,p.y*512)));if(pts.length>2)ctx.closePath();ctx.stroke();pts.forEach(p=>{ctx.fillStyle=colors[kind];ctx.beginPath();ctx.arc(p.x*512,p.y*512,3,0,Math.PI*2);ctx.fill()})}}
function current(){return state.batch.records[state.index]}
function load(){state.points={baseline:{disc:[],cup:[]},future:{disc:[],cup:[]}};const item=current();document.getElementById('caseMeta').textContent=`${item.eye_id} · ${item.laterality} · ${item.horizon_years.toFixed(2)} years · ${item.split}${item.repeat_group?' · blinded repeat':''}`;document.getElementById('progress').textContent=`${state.index+1} / ${state.batch.records.length}`;for(const which of ['baseline','future']){const image=new Image();image.onload=()=>{state.images[which]=image;draw(which)};image.src=item[`${which}_asset`]}document.getElementById('status').textContent=''}
for(const which of ['baseline','future'])document.getElementById(which).addEventListener('click',event=>{const rect=event.target.getBoundingClientRect();state.points[which][state.mode].push({x:(event.clientX-rect.left)/rect.width,y:(event.clientY-rect.top)/rect.height});draw(which)});
function mode(value){state.mode=value;document.getElementById('discMode').classList.toggle('active',value==='disc');document.getElementById('cupMode').classList.toggle('active',value==='cup')}
discMode.onclick=()=>mode('disc');cupMode.onclick=()=>mode('cup');undo.onclick=()=>{for(const which of ['future','baseline']){const pts=state.points[which][state.mode];if(pts.length){pts.pop();draw(which);break}}};clear.onclick=()=>{state.points.baseline[state.mode]=[];state.points.future[state.mode]=[];draw('baseline');draw('future')};previous.onclick=()=>{if(state.index>0){state.index--;load()}};next.onclick=()=>{if(state.index+1<state.batch.records.length){state.index++;load()}};
save.onclick=async()=>{for(const which of ['baseline','future'])for(const kind of ['disc','cup'])if(state.points[which][kind].length<3){status.textContent=`Trace ${which} ${kind} first`;return}const item=current(),payload={annotation_id:item.annotation_id,annotator_code:annotator.value.trim(),progression_label:label.value,quality_acceptable:quality.checked,findings:[...document.querySelectorAll('.findings input:checked')].map(x=>x.value),notes:notes.value,...Object.fromEntries(['baseline','future'].flatMap(w=>['disc','cup'].map(k=>[`${w}_${k}_points`,state.points[w][k]])))};status.textContent='Saving…';const response=await fetch('/api/annotation',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});const result=await response.json();if(!response.ok){status.textContent=result.error||'Save failed';return}status.textContent='Saved';if(state.index+1<state.batch.records.length){state.index++;load()}};
fetch('/batch.json').then(r=>r.json()).then(data=>{state.batch=data;load()});
</script>
</body></html>
