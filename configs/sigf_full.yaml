dataset:
  name: sigf
  root: data/sigf
  manifest: null
mode: forecasting
image_size: 384
max_context_visits: 5
one_year_tolerance: [0.75, 1.25]
training:
  device: auto
  seed: 20260720
  batch_size: 8
  gradient_accumulation_steps: 2
  mixed_precision: auto
  gradient_checkpointing: true
  max_steps: 200000
  validate_every_steps: 1000
  checkpoint_every_steps: 2000
  auto_reduce_batch_on_oom: true
model:
  base_channels: 128
  channel_multipliers: [1, 2, 4, 4]
  temporal_layers: 6
  objective: velocity
