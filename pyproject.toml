[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "glaucoma-future-diffusion"
version = "0.1.0"
description = "Research prototype for longitudinal glaucoma fundus forecasting with temporal diffusion."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "Research Prototype"}]
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "Pillow>=10.0",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
vision = ["opencv-python>=4.8", "scikit-image>=0.22"]
ml = ["torch>=2.2", "torchvision>=0.17", "scikit-learn>=1.3", "tqdm>=4.66"]
reports = ["jinja2>=3.1", "matplotlib>=3.8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py39"
